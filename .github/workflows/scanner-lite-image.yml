name: Scanner lite image (Render)

# Builds apps/scanner/Dockerfile.lite and publishes it to GHCR so Render's free
# plan can run it as an image-backed web service (no Git provider link needed).
on:
  push:
    branches: [main]
    paths: ["apps/scanner/**", "packages/shared/**", "pnpm-lock.yaml", ".github/workflows/scanner-lite-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/red-scanner-lite
  RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/scanner/Dockerfile.lite
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Smoke test /health
        run: |
          docker run -d --name red-scanner-smoke -p 4000:4000 -e SCANNER_MODE=lite \
            -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_SERVICE_ROLE_KEY=placeholder \
            ${{ env.IMAGE }}:${{ github.sha }}
          # Placeholder DB may report degraded; we only need the process serving.
          for i in $(seq 1 20); do curl -sS -o /dev/null -w '%{http_code}\n' localhost:4000/health && exit 0; sleep 2; done
          docker logs red-scanner-smoke; exit 1
      - name: Redeploy on Render (if hook set)
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
