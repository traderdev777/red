# Fly.io config for the RED scanner (Docker image from apps/scanner/Dockerfile).
#   fly launch --no-deploy --copy-config --name <app>
#   fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... SCANNER_BOT_URL=... GEMINI_API_KEY=... RED_SECRETS_KEY=...
#   fly deploy
app = "red-scanner"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "apps/scanner/Dockerfile"

[env]
  SCAN_CONCURRENCY = "2"
  NODE_ENV = "production"

# The worker polls the queue; it must stay up (no auto-stop).
[[services]]
  internal_port = 4000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
